# Phase 1: PostgreSQL + API only. Redis is intentionally NOT here yet — it arrives with the
# idempotency feature in a later phase.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Ledger: "Host=postgres;Port=5432;Database=ledger;Username=ledger;Password=ledger"
      # TEST hook: lets the K6 suite pick a strategy per request via X-Concurrency-Strategy. Off in production.
      Ledger__AllowStrategyOverride: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # K6 load tests (opt-in). Run e.g.:
  #   docker compose run --rm k6 run /scripts/01-race-withdrawals.js
  #   docker compose run --rm -e STRATEGY=naive k6 run /scripts/01-race-withdrawals.js
  k6:
    image: grafana/k6:latest
    profiles: [test]
    environment:
      BASE_URL: "http://api:8080"
    volumes:
      - ./k6:/scripts
    depends_on:
      - api

volumes:
  pgdata:
